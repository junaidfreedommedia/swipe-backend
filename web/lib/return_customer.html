<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Your Swipe Email</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>body,table,td,p{margin:0;padding:0}img{display:block;border:0;line-height:100%}a{text-decoration:none}</style>
</head>
<body style="background-color:#ffffff;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="width:100%;max-width:600px;margin:0 auto;box-shadow:rgba(100,100,111,0.2) 0 7px 29px 0;border-radius:25px 25px 0 0;">
          <tr>
            <td align="center" style="padding:10px;">
              <img src="https://swipe.ai/wp-content/uploads/2025/10/Swipe-logo-social.png" alt="Swipe" width="125" style="width:125px;height:auto;">
              <p style="margin:4px 0 10px;color:#40516F;font-size:15px;line-height:22px;font-weight:700;">[STORE_NAME]</p>
            </td>
          </tr>
          <tr>
            <td align="center">
              <div style="background:#F6F0E9;margin:0 30px 30px;border-radius:20px;padding:40px;">
                <h1 style="font-size:34px;line-height:40px;font-weight:700;color:#40516F;margin:0 0 34px;">[HEADLINE]</h1>
                <h2 style="color:#40516F;font-size:18px;line-height:26px;margin:0 0 15px;text-align:left;font-weight:600;">Hi [CUSTOMER_NAME],</h2>
                <p style="font-size:17px;line-height:24px;color:#40516F;margin:0 0 20px;text-align:left;letter-spacing:0.4px;">[MESSAGE]</p>
                [DETAILS_HTML]
                [ACTION_HTML]
              </div>
            </td>
          </tr>
          <tr>
            <td align="center">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td align="left" valign="top" style="padding:0 30px 30px;">
                    <p style="margin:0;font-size:16px;line-height:24px;color:#40516F;text-align:left;border-radius:20px;background:#F8F6F7;font-weight:500;padding:30px;letter-spacing:0.44px;">[FOOTER_MESSAGE]</p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td align="center" style="background:#333333;padding:38px 30px 40px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td align="center" style="padding:0 0 20px;">
                    <img src="https://swipe.ai/wp-content/uploads/2025/08/footer-logo-1.png" width="107" alt="Swipe" style="display:block;width:107px;height:auto;margin:0 auto;">
                  </td>
                </tr>
                <tr>
                  <td align="center">
                    <p style="margin:0;font-size:12px;line-height:20px;color:#ffffff;text-align:center;">&copy; [CURRENT_YEAR] Swipe.ai. All Rights Reserved</p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
